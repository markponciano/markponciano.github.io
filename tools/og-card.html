<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8">
<link rel="stylesheet" href="../fonts.css"><link rel="stylesheet" href="../styles.css">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:var(--bg)}
.card{box-sizing:border-box;width:1200px;height:630px;padding:70px 80px;display:flex;flex-direction:column;justify-content:space-between;
  background:radial-gradient(900px 500px at 100% 0%,color-mix(in srgb,var(--navy) 18%,transparent),transparent 70%),var(--bg)}
.top{display:flex;align-items:center;gap:16px;font-family:var(--mono);font-size:26px;font-weight:600;color:var(--ink)}
.top img{width:56px;height:56px;border-radius:50%;border:2px solid var(--line)}
.top b{color:var(--amber)}
.ey{font-family:var(--mono);font-size:22px;letter-spacing:3px;text-transform:uppercase;color:var(--amber);margin:0 0 20px}
h1{font-family:var(--serif);font-size:66px;line-height:1.08;margin:0;color:var(--ink);max-width:980px}
.bot{display:flex;justify-content:space-between;align-items:flex-end;font-size:24px;color:var(--muted)}
.bot .n{font-family:var(--mono);color:var(--navy);font-weight:600}
</style></head><body>
<div class="card">
  <div class="top"><img src="../mark.jpg" alt=""><span>mark<b>.</b>ponciano</span></div>
  <div><p class="ey">Numbers you can trust · Systems that run themselves</p>
  <h1>I turn back-office chaos into systems that run themselves.</h1></div>
  <div class="bot"><span>A bookkeeper's accuracy, a builder's hands.</span><span><span class="n">£80k</span> found · <span class="n">~130</span> checks, no downtime</span></div>
</div>
</body></html>
